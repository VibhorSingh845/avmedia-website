
# BEGIN AVCLINICFLOW
server {
    listen 80;
    listen [::]:80;
    server_name avclinicflow.com www.avclinicflow.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://avmedia-clinicflow-site:80;
        proxy_set_header Host $host;
    }
}
# END AVCLINICFLOW
