
# BEGIN AVCLINICFLOW
server {
    listen 80;
    listen [::]:80;
    server_name avclinicflow.com www.avclinicflow.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://avclinicflow.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.avclinicflow.com;
    ssl_certificate /etc/letsencrypt/live/avclinicflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avclinicflow.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://avclinicflow.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name avclinicflow.com;
    ssl_certificate /etc/letsencrypt/live/avclinicflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avclinicflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://avmedia-clinicflow-site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
# END AVCLINICFLOW
